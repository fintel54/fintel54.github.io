<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplikacja Pogodowa - PTW LAB D</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Aplikacja Pogodowa</h1>

        <div class="search-section">
            <input
                type="text"
                id="cityInput"
                class="city-input"
                placeholder="Wprowadź nazwę miasta..."
                autocomplete="off"
            >
            <button id="weatherBtn" class="weather-btn">Pogoda</button>
        </div>

        <div id="errorMsg" class="error-message"></div>

        <div id="currentWeather" class="weather-section">
            <h2>Pogoda bieżąca</h2>
            <div id="currentWeatherContent" class="weather-content"></div>
        </div>

        <div id="forecast" class="forecast-section">
            <h2>Prognoza na 5 dni</h2>
            <div id="forecastContent" class="forecast-content"></div>
        </div>
    </div>
</body>
</html>
